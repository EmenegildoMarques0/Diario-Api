[supervisord]
nodaemon=true
user=root
loglevel=info

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; --- Configuração do Laravel Queue Worker ---
[program:laravel-worker]
; Nome do processo, incluindo o número da instância
process_name=%(program_name)s_%(process_num)02d
; Comando que inicia o worker (sem a flag --daemon, o supervisor gerencia o ciclo de vida)
command=php /var/www/artisan queue:work --tries=3 --timeout=60 --sleep=3
; Número de processos worker a serem executados simultaneamente
numprocs=2
autostart=true
autorestart=true
; Usuário com o qual o processo será executado
user=www-data
; Redireciona erros para a saída padrão para centralizar no console
redirect_stderr=true
; Envia a execução diretamente para o terminal principal (stdout) do Render
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; Tempo de espera para encerramento gracioso
stopwaitsecs=30
