[supervisord]
nodaemon=true
loglevel=debug
logfile=/var/www/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; PHP-FPM
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/www/storage/logs/php-fpm-out.log
stderr_logfile=/var/www/storage/logs/php-fpm-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; NGINX
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/www/storage/logs/nginx-supervisor-out.log
stderr_logfile=/var/www/storage/logs/nginx-supervisor-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; TAIL: NGINX ACCESS LOG
[program:nginx-access-log]
command=tail -F /var/www/storage/logs/nginx-access.log
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/www/storage/logs/nginx-access-tail.log
stderr_logfile=/var/www/storage/logs/nginx-access-tail-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; TAIL: NGINX ERROR LOG
[program:nginx-error-log]
command=tail -F /var/www/storage/logs/nginx-error.log
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/www/storage/logs/nginx-error-tail.log
stderr_logfile=/var/www/storage/logs/nginx-error-tail-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; LARAVEL LOGS (mantém seus tails)
[program:laravel-main-log]
command=tail -F /var/www/storage/logs/laravel.log
autostart=true
autorestart=true
priority=110
stdout_logfile=/var/www/storage/logs/laravel-main-output.log
stderr_logfile=/var/www/storage/logs/laravel-main-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:laravel-all-logs]
command=sh -c "tail -F /var/www/storage/logs/*.log"
autostart=true
autorestart=true
priority=120
stdout_logfile=/var/www/storage/logs/laravel-all-output.log
stderr_logfile=/var/www/storage/logs/laravel-all-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
