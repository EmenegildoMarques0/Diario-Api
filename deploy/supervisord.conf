[supervisord]
nodaemon=true
loglevel=info

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/var/www/storage/logs/php-fpm.log
stderr_logfile=/var/www/storage/logs/php-fpm.log
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/www/storage/logs/nginx.log
stderr_logfile=/var/www/storage/logs/nginx.log
autorestart=true

[program:nightwatch-agent]
command=php /var/www/artisan nightwatch:agent
directory=/var/www
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/nightwatch_agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
