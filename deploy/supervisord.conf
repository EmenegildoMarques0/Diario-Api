[supervisord]
nodaemon=true
logfile=/var/www/storage/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/www/storage/supervisor.pid
user=www-data
minfds=1024
minprocs=200

[supervisorctl]
serverurl=unix:///var/www/storage/supervisor.sock

[unix_http_server]
file=/var/www/storage/supervisor.sock
chmod=0700
chown=www-data:www-data

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/storage/logs/nginx-access.log
stderr_logfile=/var/www/storage/logs/nginx-error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
priority=10

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/storage/logs/php-fpm-out.log
stderr_logfile=/var/www/storage/logs/php-fpm-error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
priority=20
