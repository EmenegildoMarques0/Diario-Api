[supervisord]
nodaemon=true
loglevel=debug
logfile=/var/www/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; =====================================================
; PHP-FPM
; =====================================================
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/php-fpm-out.log
stderr_logfile=/var/www/storage/logs/php-fpm-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; =====================================================
; NGINX
; =====================================================
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/nginx-supervisor-out.log
stderr_logfile=/var/www/storage/logs/nginx-supervisor-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; =====================================================
; NGINX ACCESS LOG + ERROR LOG (TAIL)
; =====================================================
[program:nginx-access-log]
command=tail -F /var/log/nginx/access.log
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/nginx-access.log
stderr_logfile=/var/www/storage/logs/nginx-access-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx-error-log]
command=tail -F /var/log/nginx/error.log
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/nginx-error.log
stderr_logfile=/var/www/storage/logs/nginx-error-tail-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; =====================================================
; LOGS DO LARAVEL (VÁRIOS ARQUIVOS)
; =====================================================
[program:laravel-main-log]
command=tail -F /var/www/storage/logs/laravel.log
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/laravel-main-output.log
stderr_logfile=/var/www/storage/logs/laravel-main-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:laravel-horizon-log]
command=tail -F /var/www/storage/logs/horizon.log
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/horizon-output.log
stderr_logfile=/var/www/storage/logs/horizon-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Capture *todos* os arquivos de log dentro de storage/logs
[program:laravel-all-logs]
command=sh -c "tail -F /var/www/storage/logs/*.log"
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/laravel-all-output.log
stderr_logfile=/var/www/storage/logs/laravel-all-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
