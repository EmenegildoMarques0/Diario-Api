[supervisord]
nodaemon=true
loglevel=info

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/var/www/storage/logs/php-fpm.log
stderr_logfile=/var/www/storage/logs/php-fpm.log
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/www/storage/logs/nginx.log
stderr_logfile=/var/www/storage/logs/nginx.log
autorestart=true

; --- Configuração do Laravel Queue Worker ---
[program:laravel-worker]
; Nome do processo, incluindo o número da instância
process_name=%(program_name)s_%(process_num)02d
; Comando que inicia o worker do Laravel
command=php /var/www/artisan queue:work --tries=3 --timeout=60 --sleep=3 --daemon
; Número de processos worker a serem executados simultaneamente.
; Ajuste este valor (ex: 1, 2, 4...) conforme a carga de trabalho.
numprocs=2
autostart=true
autorestart=true
; Usuário com o qual o processo será executado
user=www-data
redirect_stderr=true
; Localização dos logs do worker
stdout_logfile=/var/www/storage/logs/worker.log
stderr_logfile=/var/www/storage/logs/worker_error.log
; Define se o processo será encerrado se o Supervisor for encerrado.
stopwaitsecs=30
