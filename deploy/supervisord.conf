; Configuração do Supervisor para Laravel com PHP-FPM e Nginx no Docker

[supervisord]
nodaemon=true                    ; Roda em foreground (necessário para Docker)
logfile=/var/www/storage/logs/supervisord.log ; Arquivo de log do Supervisor
logfile_maxbytes=50MB            ; Tamanho máximo do log
logfile_backups=10               ; Número de backups de log
loglevel=info                    ; Nível de log (info para depuração)
pidfile=/var/run/supervisord.pid ; Arquivo PID
user=www-data                    ; Roda como usuário do web server
minfds=1024                      ; Mínimo de file descriptors
minprocs=200                     ; Mínimo de processos


; Programa: Nginx
[program:nginx]
command=nginx -g "daemon off;"   ; Roda Nginx em foreground
autostart=true                   ; Inicia automaticamente
autorestart=true                 ; Reinicia se falhar
user=www-data                    ; Roda como www-data
stdout_logfile=/var/www/storage/logs/nginx-access.log ; Log de saída
stderr_logfile=/var/www/storage/logs/nginx-error.log  ; Log de erros
stdout_logfile_maxbytes=50MB     ; Tamanho máximo do log
stderr_logfile_maxbytes=50MB     ; Tamanho máximo do log
priority=10                      ; Alta prioridade

; Programa: PHP-FPM
[program:php-fpm]
command=/usr/sbin/php-fpm -F      ; Roda PHP-FPM em foreground
autostart=true                   ; Inicia automaticamente
autorestart=true                 ; Reinicia se falhar
user=www-data                    ; Roda como www-data
stdout_logfile=/var/www/storage/logs/php-fpm-out.log ; Log de saída
stderr_logfile=/var/www/storage/logs/php-fpm-error.log ; Log de erros
stdout_logfile_maxbytes=50MB     ; Tamanho máximo do log
stderr_logfile_maxbytes=50MB     ; Tamanho máximo do log
priority=20                      ; Prioridade média

; Programa: Monitoramento de log de erros do Nginx
[program:nginx-error-log]
command=tail -F /var/www/storage/logs/nginx-error.log
autostart=true                   ; Inicia automaticamente
autorestart=true                 ; Reinicia se falhar
user=www-data                    ; Roda como www-data
stdout_logfile=/dev/stdout       ; Redireciona para stdout (Docker logs)
stderr_logfile=/dev/stderr       ; Redireciona para stderr (Docker logs)
stdout_logfile_maxbytes=0        ; Sem limite de tamanho
stderr_logfile_maxbytes=0        ; Sem limite de tamanho
priority=100                     ; Baixa prioridade

; Programa: Monitoramento de log de acesso do Nginx
[program:nginx-access-log]
command=tail -F /var/www/storage/logs/nginx-access.log
autostart=true                   ; Inicia automaticamente
autorestart=true                 ; Reinicia se falhar
user=www-data                    ; Roda como www-data
stdout_logfile=/dev/stdout       ; Redireciona para stdout (Docker logs)
stderr_logfile=/dev/stderr       ; Redireciona para stderr (Docker logs)
stdout_logfile_maxbytes=0        ; Sem limite de tamanho
stderr_logfile_maxbytes=0        ; Sem limite de tamanho
priority=101                     ; Baixa prioridade

; Programa: Monitoramento de log de erros do PHP
[program:php-errors]
command=tail -F /var/www/storage/logs/php_errors.log
autostart=true                   ; Inicia automaticamente
autorestart=true                 ; Reinicia se falhar
user=www-data                    ; Roda como www-data
stdout_logfile=/dev/stdout       ; Redireciona para stdout (Docker logs)
stderr_logfile=/dev/stderr       ; Redireciona para stderr (Docker logs)
stdout_logfile_maxbytes=0        ; Sem limite de tamanho
stderr_logfile_maxbytes=0        ; Sem limite de tamanho
priority=102                     ; Baixa prioridade

; Programa: Monitoramento de log principal do Laravel
[program:laravel-main-log]
command=tail -F /var/www/storage/logs/laravel.log
autostart=true                   ; Inicia automaticamente
autorestart=true                 ; Reinicia se falhar
user=www-data                    ; Roda como www-data
stdout_logfile=/dev/stdout       ; Redireciona para stdout (Docker logs)
stderr_logfile=/dev/stderr       ; Redireciona para stderr (Docker logs)
stdout_logfile_maxbytes=0        ; Sem limite de tamanho
stderr_logfile_maxbytes=0        ; Sem limite de tamanho
priority=103                     ; Baixa prioridade
