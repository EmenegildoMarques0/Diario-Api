[program:nginx-error-log]
command=tail -F /var/www/storage/logs/nginx-error.log
autostart=true
autorestart=true
priority=100
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile=/var/www/storage/logs/nginx-error-tail.log
stderr_logfile=/var/www/storage/logs/nginx-error-tail-error.log

[program:nginx-access-log]
command=tail -F /var/www/storage/logs/nginx-access.log
autostart=true
autorestart=true
priority=101
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile=/var/www/storage/logs/nginx-access-tail.log
stderr_logfile=/var/www/storage/logs/nginx-access-tail-error.log

[program:php-errors]
command=tail -F /var/www/storage/logs/php_errors.log
autostart=true
autorestart=true
priority=102
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile=/var/www/storage/logs/php-errors-tail.log
stderr_logfile=/var/www/storage/logs/php-errors-tail-error.log

[program:laravel-main-log]
command=tail -F /var/www/storage/logs/laravel.log
autostart=true
autorestart=true
priority=103
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile=/var/www/storage/logs/laravel-tail.log
stderr_logfile=/var/www/storage/logs/laravel-tail-error.log
