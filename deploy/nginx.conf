user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logs (escrevem em /var/log/nginx/*.log -> no container isso é symlink para /var/www/storage/logs)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log  info;

    # Upstream PHP-FPM (server local, porta 9000)
    upstream php-fpm {
        server 127.0.0.1:9000;
        # se preferir socket unix (mais rápido), troque para:
        # server unix:/run/php/php7.4-fpm.sock;  # ajuste conforme a sua versão/path
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/public;
        index index.php index.html;

        # Limite de upload alinhado ao php.ini do Dockerfile
        client_max_body_size 12M;

        # Regra principal: tenta arquivo, diretório, cai para index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Tratamento de PHP via fastcgi (PHP-FPM)
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Tempo de leitura/execução maior para endpoints pesados
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
        }

        # Bloqueia arquivos sensíveis
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Ajustes para segurança / headers mínimos (opcional)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Server default para retornar 444 em requests perigosos (opcional)
    # server { listen 127.0.0.1:8081; return 444; }
}
