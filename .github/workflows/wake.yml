name: Wake API

# Agendamento da action
on:
  schedule:
    # A cada 10 minutos (ajustado para evitar sobrecarga no plano gratuito do Render)
    - cron: '*/8 * * * *'
  workflow_dispatch: # Permite disparar manualmente também

jobs:
  request_api:
    runs-on: ubuntu-latest
    steps:
      - name: Request API
        run: |
          echo "Making request to Diário do Estilo API..."
          RESPONSE=$(curl -s -w "%{http_code}" -o response.txt https://diario-do-estilo-api-1-0-0.onrender.com/)
          echo "HTTP Status Code: $RESPONSE"
          echo "Response Body:"
          cat response.txt
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Request successful!"
          else
            echo "Request returned status $RESPONSE, but continuing to keep service alive."
          fi
        continue-on-error: true # Continua mesmo se a requisição falhar
